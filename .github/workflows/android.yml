name: Android (밤낮)
# [REPO-01] 1.34: the repository is private (결정 D110), where Actions has 2,000 minutes a month. A draft pull request runs
# the quick checks only (servers, core, tracker); the app's shards and lint run once it is ready for review, or by hand
# (Actions › Android › Run workflow). main is not built again after a merge: the same commits passed on the pull request.
# 2.0.0 [RVR-14] (총괄 HQ-37) 통합 PR은 초안이라 그 머리에서 앱 시험이 돌지 않았어요(서버 PR #463 뒤 InviteAppTest가 깨진 채
# 들어가 그 위 PR 넷이 함께 빨강). 통합 브랜치에 들어올 때마다 서버·core와 앱 (unit)이 돌아요(겹친 push는 앞 것을 멈춰요).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["shift-calendar-app/**", "privacy/**", "terms/**", "community/**", "remote/**", ".github/workflows/android.yml"]
  push:
    branches: [claude/project-thread-f33c16]
    # 추적표·개발 기록만 바뀐 push는 돌지 않아요(총괄이 줄을 넣을 때마다 앞 실행이 멈추지 않게). 그 검사 셋은 올리기 전에 손으로 돌려요.
    paths: ["shift-calendar-app/**", "privacy/**", "terms/**", "community/**", "remote/**", ".github/workflows/android.yml",
            "!shift-calendar-app/docs/plans/**", "!shift-calendar-app/docs/tracker.csv", "!shift-calendar-app/ops/dev-status.jsonl"]
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
# [QA-05] The checks run as shards side by side instead of one job after another: the longest shard sets the
# wall clock. Gradle's cache is written only from main, so a pull request cannot fill it with its own builds.
env:
  GRADLE_FLAGS: --no-daemon -Pkotlin.compiler.execution.strategy=in-process --console=plain
jobs:
  servers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: shift-calendar-app/server/share-worker
      # 2.0.0 [RVN-24] 검토 SVC-110: 사이트 서버(bamnat.app)의 질의·머리·HEAD·404 시험도 CI에서.
      - run: node --test test/site.test.mjs
        working-directory: shift-calendar-app/server/site-worker
      - run: npm test
        working-directory: shift-calendar-app/server/company-worker
      # 2.0.0 [RVQ-55] 사이트 서버(bamnat.app 앞의 Worker): 없는 주소의 밤낮 404와 보안 머리. 전에는 CI에서 돌지 않았어요.
      - run: node --test test/site.test.mjs
        working-directory: shift-calendar-app/server/site-worker
      # [ADMUX-08] The admin app's happy-dom screen tests need the devDependency from the lock file.
      - run: npm ci && npm run test:ui
        working-directory: shift-calendar-app/server/company-worker
      # [RVR-03] 공개 사이트(bamnat.app): 임시 폴더에 만들어 공개 파일 목록·금지 글자·지난해 숫자를 보고, 웹 계산기를 앱과 같은 사례로 시험해요.
      - run: pip install --quiet openpyxl==3.1.5 && python3 tools/site/build.py --check
        working-directory: shift-calendar-app
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: shift-calendar-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # The pinned tool packages below (pillow 11.1.0, cryptography 44.0.2) ship wheels for this Python; the runner's own newer one
      # has none for pillow 11.1.0 and building it needs libjpeg (core job red on a8eb588e).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/check_tracker.py
      - run: python3 tools/test_check_checklist.py && python3 tools/test_app_size.py && python3 tools/test_market_works.py && python3 tools/test_market_health.py
      # [RVR-26] 개발 기록에 적힌 '잡을 시험'이 정말 있는지도: 시험 이름을 바꾸거나 지운 PR에서 바로 알아요.
      - run: python3 tools/test_dev_status.py && python3 tools/dev_status.py check
      # [I60b-01][U60-01] 날짜 시험 요약·PR 요약의 '처음 깨짐/기준에서도 깨짐' 도구
      - run: python3 tools/test_date_watch.py && python3 tools/test_slow_tests.py && python3 tools/test_bundle_check.py
      # 2.0.0 [RVR-38] 날짜 장부(ops/dates.json)가 가리키는 코드 줄이 모두 하나씩 있는지
      - run: python3 tools/test_dates_ledger.py && python3 tools/dates_ledger.py check
      # [RVR-12] (검토 TEST-13) 손으로 만드는 자료도 CI가 봐요: 근무주기 표가 CSV에서 그대로 나오는지, 공개 자료(remote/v1)가
      # 믿는 열쇠로 서명됐는지(.sig2), 핵심 화면 사진 이름이 시험에 그대로 있는지, 그리고 그 도구들의 시험.
      - run: python3 tools/test_cycles_build.py && python3 tools/cycles_build.py --check
      - run: pip install --quiet cryptography==44.0.2 && python3 tools/test_remote_sign.py && python3 tools/remote_sign.py check --need-sig2
      - run: pip install --quiet pillow==11.1.0 && python3 tools/test_shot_hashes.py && python3 tools/shot_hashes.py names
      - run: sh ./gradlew $GRADLE_FLAGS -p core test
      # 2.0.0 [U60-01] (검토 2026-11-12) 기준 브랜치(PR이면 합칠 곳, push면 같은 브랜치)의 마지막 실행에서 같은 일의 결과를 받아,
      # 요약 맨 위 실패를 '이 PR에서 처음 깨짐'과 '기준에서도 깨짐(날짜·바깥 탓)'으로 나눠요. 못 받으면 그렇다고 적고 지나가요.
      - name: 기준 브랜치 결과 받기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref || github.ref_name }}
          NAME: tests-core
        run: |
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow android.yml --branch "$BASE" --status completed --limit 8 --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n "$NAME" -D build/base 2>/dev/null && break
          done
          true
      - if: always()
        run: python3 tools/slow_tests.py core/build/test-results --json build/tests/tests-core.json --base build/base/tests-core.json >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-core
          path: shift-calendar-app/build/tests/tests-core.json
          retention-days: 14
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-reports
          path: shift-calendar-app/core/build/reports
          retention-days: 7
  # The app's tests in six shards: everything but the screenshots, the screenshot classes in four parts split by time
  # (2.0.0 [RVR-43], tools/shot_shards.py), and the classes that run on Android 8, 11, 13 and 15 (app/build.gradle.kts
  # bamnat.testSet). Each shard runs its classes in parallel forks too.
  app:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # [RVR-14] A push to the integration branch runs the unit shard only (the screenshots and Android levels run on its PR).
        set: ${{ fromJSON(github.event_name == 'push' && '["unit"]' || '["unit", "shots-a", "shots-b", "shots-c", "shots-d", "shots-e", "api"]') }}
    defaults:
      run:
        working-directory: shift-calendar-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # 2.0.0 [RVR-46] 앱을 처음부터 컴파일하면 Gradle 기본 4g 힙이 모자라 'Java heap space'로 떨어졌어요(11-19 묶음 확인 실행, shots-e·unit). 홈의 gradle.properties가 저장소 것보다 앞서요.
      - run: mkdir -p "$HOME/.gradle" && echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' >> "$HOME/.gradle/gradle.properties"
      # Robolectric's Android jars (100 MB and more) come from Maven Central once, then from this cache.
      # 2.0.0 [RVR-43]: one cache per shard (each needs the same Android versions every run), keyed on the Robolectric version and
      # the test SDK rather than all of build.gradle.kts, and saved even when tests fail (a red shard used to throw its download
      # away, so every run fetched again and Maven Central answered 429). A shard whose download failed does not save.
      - id: robover
        run: |
          echo "v=$(grep -o 'org.robolectric:robolectric:[0-9.]*' app/build.gradle.kts | cut -d: -f3)" >> "$GITHUB_OUTPUT"
      - id: robo
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ matrix.set }}-${{ steps.robover.outputs.v }}-${{ hashFiles('shift-calendar-app/app/src/test/resources/robolectric.properties') }}
          restore-keys: |
            robolectric-${{ matrix.set }}-
            robolectric-
      # [RVR-12] (검토 TEST-13) Node 22 before Gradle: the app tests that start server/company-worker (node:sqlite) need it, and
      # in CI (CI=true) a test that cannot find Node or the privacy page fails instead of being skipped (app test CiNeed.kt).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 2.0.0 [RVR-43] (총괄 HQ-121): the tests stop at 38 minutes so a shard that runs long fails with its results and summary
      # instead of the whole job being cancelled at 45 (a cancelled shard hid its failures). Over 30 minutes is a warning.
      - name: 앱 시험
        timeout-minutes: 38
        run: |
          start=$(date +%s)
          rc=0; sh ./gradlew $GRADLE_FLAGS :app:testDebugUnitTest -Pbamnat.testSet=${{ matrix.set }} --continue || rc=$?
          min=$(( ($(date +%s) - start) / 60 ))
          if [ "$min" -ge 30 ]; then
            echo "::warning::${{ matrix.set }} 묶음이 ${min}분 걸렸어요(30분 넘음). python3 tools/shot_shards.py update로 나누기를 다시 해요."
            echo "### ⚠ ${{ matrix.set }} 묶음 ${min}분(30분 넘음): tests-app-${{ matrix.set }} 결과로 tools/shot_shards.py update" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc
      # 2.0.0 [RVR-42] (총괄 HQ-116): the tests never reach a server outside the runner (tools/net-guard, NetGuardTest). What
      # they tried and were refused is listed here, so a test that leans on the network shows up without touching the live server.
      - name: Robolectric 캐시 저장 준비
        id: robosave
        if: always() && steps.robo.outputs.cache-hit != 'true'
        run: |
          ls ~/.m2/repository/org/robolectric/android-all*/*/*.jar >/dev/null 2>&1 || exit 0
          grep -rlqE "Failed to fetch maven artifact|HTTP response code: 4[0-9][0-9]" app/build/test-results 2>/dev/null && { echo "Robolectric jar를 다 받지 못해 캐시를 저장하지 않아요"; exit 0; }
          echo "save=1" >> "$GITHUB_OUTPUT"
      - if: always() && steps.robosave.outputs.save == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robo.outputs.cache-primary-key }}
      - name: 바깥 연결 막은 것
        if: always()
        run: |
          f=$(ls app/build/net-guard/blocked/*.txt 2>/dev/null || true)
          if [ -z "$f" ]; then echo "### 바깥 연결: 시험이 바깥 서버를 부르지 않았어요" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          { echo "### 바깥 연결: 시험이 부르려다 막힌 곳 $(cat $f | wc -l)번 (실서버에는 가지 않았어요)"; echo '```';
            cat $f | sed -E 's#^([a-z]+://[^/]+)(/[^/?]*(/[^/?]*)?).*#\1\2#' | sort | uniq -c | sort -rn | head -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Room writes the schema of each database version it builds. A new version has to be committed with its migration.
      - name: Room schema committed
        if: matrix.set == 'unit'
        run: |
          changed=$(git ls-files --others --modified --exclude-standard database/schemas)
          for f in $changed; do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done
          test -z "$changed" || { echo "Commit these schema files: $changed"; exit 1; }
      # The share server checks the payloads the app tests just wrote (app/build/share-payload*.json). [RVR-19] (검토 TEST-20 ④)
      # Here they must be there: the servers job skips them (no app run), so this is the one place they are checked.
      - if: matrix.set == 'unit'
        run: npm test
        working-directory: shift-calendar-app/server/share-worker
        env:
          BAMNAT_NEED_APP_PAYLOADS: "1"
      # 2.0.0 [RVR-22] (검토 SD-09) The company server's half of the 바깥 길 시험: the bodies OutsideBodiesTest just wrote.
      - if: matrix.set == 'unit'
        run: node --test --disable-warning=ExperimentalWarning test/outside-bodies.test.mjs
        working-directory: shift-calendar-app/server/company-worker
        env:
          BAMNAT_NEED_APP_PAYLOADS: "1"
      # [QA-06] 43 key screenshots (drawn on a fixed day, QA-08) against their fingerprints (tools/shot_hashes.py); a change that was meant
      # comes with `python3 tools/shot_hashes.py update app/build/screenshots` in the same pull request. [RVR-11] With --results, a key
      # shot whose test class ran in this shard but left no picture fails ('비교 못 함') instead of passing without a word.
      - if: startsWith(matrix.set, 'shots-')
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Key screenshots unchanged
        if: startsWith(matrix.set, 'shots-')
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/shot_hashes.py check app/build/screenshots --results app/build/test-results/testDebugUnitTest >> "$GITHUB_STEP_SUMMARY"
      # 2.0.0 [RVR-39] (검토 TEST-12 ①·I60b-03) 43장 골든 밖의 모든 사진도: 사진마다 지문(픽셀 sha1, 회색 32x48, 색 8x12)을 남기고,
      # 지난 실행(같은 브랜치의 앞 실행, 없으면 가장 최근 실행)의 지문과 견줘 '어제와 다른 장'을 요약에 적어요(실패로 막지는 않아요).
      # 가장 많이 바뀐 24장은 오늘·어제 회색·바뀐 곳을 나란히 한 그림(shot-diff 결과 묶음)으로.
      - name: 어제와 다른 화면 사진
        if: always() && startsWith(matrix.set, 'shots-')
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.head_ref || github.ref_name }}
          NAME: shot-prints-${{ matrix.set }}
        run: |
          python3 tools/shot_hashes.py prints app/build/screenshots --out build/shot-prints/prints.json || exit 0
          got=""
          for q in "--branch $HEAD" ""; do
            for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow android.yml $q --status completed --limit 10 --json databaseId --jq '.[].databaseId'); do
              [ "$id" = "$GITHUB_RUN_ID" ] && continue
              if gh run download "$id" -R "$GITHUB_REPOSITORY" -n "$NAME" -D build/shot-base 2>/dev/null; then got=$id; break 2; fi
            done
          done
          if [ -n "$got" ]; then
            echo "기준: 실행 $got ($(gh run view "$got" -R "$GITHUB_REPOSITORY" --json headBranch,headSha --jq '.headBranch + " " + .headSha[0:8]'))" >> "$GITHUB_STEP_SUMMARY"
            python3 tools/shot_hashes.py diff build/shot-base/prints.json build/shot-prints/prints.json --shots app/build/screenshots --sheet build/shot-prints/shot-diff.png >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 어제와 다른 화면 사진: 견줄 지난 지문이 없어요(첫 실행이거나 지난 결과가 지워짐)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always() && startsWith(matrix.set, 'shots-')
        uses: actions/upload-artifact@v4
        with:
          name: shot-prints-${{ matrix.set }}
          path: |
            shift-calendar-app/build/shot-prints/prints.json
            shift-calendar-app/build/shot-prints/shot-diff.png
          if-no-files-found: ignore
          retention-days: 14
      # 2.0.0 [U60-01] (검토 2026-11-12) 기준 브랜치(PR이면 합칠 곳, push면 같은 브랜치)의 마지막 실행에서 같은 일의 결과를 받아,
      # 요약 맨 위 실패를 '이 PR에서 처음 깨짐'과 '기준에서도 깨짐(날짜·바깥 탓)'으로 나눠요. 못 받으면 그렇다고 적고 지나가요.
      - name: 기준 브랜치 결과 받기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref || github.ref_name }}
          NAME: tests-app-${{ matrix.set }}
        run: |
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow android.yml --branch "$BASE" --status completed --limit 8 --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n "$NAME" -D build/base 2>/dev/null && break
          done
          true
      - if: always()
        run: python3 tools/slow_tests.py app/build/test-results/testDebugUnitTest --json app/build/tests-${{ matrix.set }}.json --base build/base/tests-${{ matrix.set }}.json >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-app-${{ matrix.set }}
          path: shift-calendar-app/app/build/tests-${{ matrix.set }}.json
          retention-days: 14
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-reports-${{ matrix.set }}
          path: |
            shift-calendar-app/app/build/test-results/testDebugUnitTest
            shift-calendar-app/app/build/reports
            shift-calendar-app/app/build/screenshots
            shift-calendar-app/app/build/tests-${{ matrix.set }}.json
          retention-days: 7
  # 2.0.0 [RVR-46] (총괄 11-19) '묶음 확인': after a hand-run (Actions › Android › Run workflow) on a bundle's commit, one file that says
  # what the whole run passed: the verdict, one line per job, the failed and skipped tests by name, and the classes that passed
  # (tools/bundle_check.py). The PC check cites it per line ('합친 나무 시험 통과': that commit and the class). It reads the
  # tests-*.json each job wrote and GitHub's own result of each job, so a cancelled or missing shard is said, not passed over.
  bundle-check:
    needs: [core, servers, app, lint, market, admin-shots]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shift-calendar-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tests-*
          path: shift-calendar-app/build/tests-all
        continue-on-error: true
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > build/needs.json
          python3 tools/bundle_check.py build/tests-all --needs build/needs.json --sha "$GITHUB_SHA" \
            --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --out build/bundle-check >> "$GITHUB_STEP_SUMMARY" || true
          echo "묶음 확인 파일: 이 실행의 bundle-check 파일(묶음-확인.md)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-check
          path: shift-calendar-app/build/bundle-check
          retention-days: 30
  # 2.0.0 [RVR-43] (총괄 HQ-121): one line that says whether every app shard passed. A shard that was cancelled or timed out
  # counts as failed here (GitHub shows a cancelled job grey, and a check that waits for 'no failure' read it as passed).
  app-result:
    needs: app
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "앱 시험 묶음 결과: ${{ needs.app.result }}"
          case "${{ needs.app.result }}" in success|skipped) ;; *) echo "::error::앱 시험 묶음 가운데 실패·취소·시간 넘김이 있어요(${{ needs.app.result }})"; exit 1;; esac
  # 2.0.0 [RVR-14] (총괄 HQ-37) A draft pull request that changes a server runs the app tests that start that server
  # (server/company-worker/test/local-server.mjs, or the share server's payload check), so a server answer the app no longer
  # reads fails on the pull request that changed it, not on the integration branch after it.
  server-app:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shift-calendar-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if git diff --quiet ${{ github.event.pull_request.base.sha }} HEAD -- server/; then
            echo "server=0" >> "$GITHUB_OUTPUT"; echo "서버가 바뀌지 않았어요: 앱의 서버 시험은 준비 PR 때 돌아요" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "server=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.server == '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: steps.changed.outputs.server == '1'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - if: steps.changed.outputs.server == '1'
        run: mkdir -p "$HOME/.gradle" && echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' >> "$HOME/.gradle/gradle.properties"
      - if: steps.changed.outputs.server == '1'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('shift-calendar-app/app/build.gradle.kts') }}
          restore-keys: robolectric-
      - if: steps.changed.outputs.server == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # The classes that start server/company-worker/test/local-server.mjs, and ShareLinkTest (it writes the payloads the share
      # server checks next). tools/server_app_tests.py finds them in the test sources, so a new one joins by itself.
      # --rerun: the server files are not inputs of the Gradle task, so a server-only change got the app's test results FROM-CACHE
      # (nothing ran against the changed server and the payload files the share server checks were never written).
      - if: steps.changed.outputs.server == '1'
        run: sh ./gradlew $GRADLE_FLAGS :app:testDebugUnitTest --rerun $(python3 tools/server_app_tests.py --gradle) --continue
      - if: steps.changed.outputs.server == '1'
        run: npm test
        working-directory: shift-calendar-app/server/share-worker
        env:
          BAMNAT_NEED_APP_PAYLOADS: "1"
      - if: steps.changed.outputs.server == '1'
        run: node --test --disable-warning=ExperimentalWarning test/outside-bodies.test.mjs
        working-directory: shift-calendar-app/server/company-worker
        env:
          BAMNAT_NEED_APP_PAYLOADS: "1"
      - if: always() && steps.changed.outputs.server == '1'
        run: python3 tools/slow_tests.py app/build/test-results/testDebugUnitTest >> "$GITHUB_STEP_SUMMARY"
      - if: always() && steps.changed.outputs.server == '1'
        uses: actions/upload-artifact@v4
        with:
          name: server-app-reports
          path: |
            shift-calendar-app/app/build/test-results/testDebugUnitTest
            shift-calendar-app/app/build/reports
          retention-days: 7
  # 2.0.0 [RVR-21] (검토 SD-07, 스튜디오 제작 오류 점검 S6-3·S6-4) 장터 작품 전체(docs/recipes, tools/market_works.py):
  # ① 나간 판(tools/data/release-cores.json, 1.36.1~1.39)의 core를 따로 빌드해 그 판 목록에 나오는 작품이 다 열리는지(안 열리면 빨강),
  # ② 작품마다 실제로 넣은 달력을 찍어 지난 통합 빌드의 지문과 대고 크게 달라진 것만 요약에(실패 아님, 사진은 artifact market-shots),
  # ③ [RVR-22] (SD-09) 작품마다 넣은 폰의 링크·자동 갱신·회사 방식 공유·다시 올리기 몸통을 두 서버의 검사기가 모두 받는지(안 받으면 빨강).
  # 통합 브랜치 push 가운데 작품·그리기에 닿는 파일이 바뀐 것과 손으로 돌릴 때만(약 20분).
  market:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: shift-calendar-app
    steps:
      - uses: actions/checkout@v4
      - id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null || true
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git diff --quiet "$BEFORE" HEAD -- docs/recipes \
              core/src/main/kotlin/com/bamnat/core/recipe app/src/main/java/com/bamnat/app/recipe app/src/main/java/com/bamnat/app/ui/theme \
              app/src/main/java/com/bamnat/app/ui/calendar app/src/main/java/com/bamnat/app/ui/parts app/src/main/java/com/bamnat/app/ui/decor \
              server/company-worker/src/recipes.js server/company-worker/src/parts-since.js server/company-worker/tools/served-works.mjs \
              tools/market_works.py tools/old_core_check.py tools/market_shots.py tools/data/release-cores.json \
              server/share-worker/src server/company-worker/src/company-setup.js app/src/main/java/com/bamnat/app/share \
              app/src/test/java/com/bamnat/app/screenshots/MarketWorks.kt app/src/test/java/com/bamnat/app/screenshots/MarketWorksShotsTest.kt \
              app/src/test/java/com/bamnat/app/recipe/OutsideBodiesTest.kt; then
            echo "run=0" >> "$GITHUB_OUTPUT"; echo "작품·그리기에 닿는 파일이 바뀌지 않았어요: 장터 작품 대조를 건너뛰어요" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: steps.changed.outputs.run == '1'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - if: steps.changed.outputs.run == '1'
        run: mkdir -p "$HOME/.gradle" && echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' >> "$HOME/.gradle/gradle.properties"
      - if: steps.changed.outputs.run == '1'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('shift-calendar-app/app/build.gradle.kts') }}
          restore-keys: robolectric-
      - if: steps.changed.outputs.run == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.changed.outputs.run == '1'
        run: python3 tools/test_market_works.py
      - name: Old apps open every work they list
        if: steps.changed.outputs.run == '1'
        run: python3 tools/old_core_check.py --json app/build/old-core-check.json >> "$GITHUB_STEP_SUMMARY"
      - name: Every work on the calendar, and every work's bodies going out (SD-09)
        if: always() && steps.changed.outputs.run == '1'
        run: |
          sh ./gradlew $GRADLE_FLAGS :app:testDebugUnitTest --tests com.bamnat.app.screenshots.MarketWorksShotsTest \
            --tests com.bamnat.app.recipe.OutsideBodiesTest -Pbamnat.marketShots=all -Pbamnat.outsideBodies=all --rerun --continue
      - name: The three servers take every work's bodies (SD-09)
        if: always() && steps.changed.outputs.run == '1'
        env:
          BAMNAT_NEED_APP_PAYLOADS: "1"
        run: |
          (cd server/share-worker && node --test --disable-warning=ExperimentalWarning test/outside-bodies.test.mjs)
          (cd server/company-worker && node --test --disable-warning=ExperimentalWarning test/outside-bodies.test.mjs)
      - name: The last integration build's fingerprints
        if: always() && steps.changed.outputs.run == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ../prev-shots
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow android.yml --branch "$GITHUB_REF_NAME" --limit 30 --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n market-shots -D ../prev-shots >/dev/null 2>&1; then
              echo "지난 지문: 실행 $id" >> "$GITHUB_STEP_SUMMARY"; break
            fi
          done
      - name: Works that look different from the last build
        if: always() && steps.changed.outputs.run == '1'
        run: |
          prev=$(find ../prev-shots -name shots.json | head -1)
          python3 tools/market_shots.py compare "${prev:--}" app/build/market-shots/shots.json \
            --png app/build/market-shots/png --changed-out app/build/market-shots/changed --json app/build/market-compare.json >> "$GITHUB_STEP_SUMMARY"
      # 2.0.0 [RVA-56] (검토 SX-04) 두 결과를 관리자 앱 장터 건강·운영 장부가 읽는 한 장으로(올리기는 운영 열쇠를 가진 쪽이).
      - name: Market health for the admin app
        if: always() && steps.changed.outputs.run == '1'
        run: python3 tools/market_health.py --shots app/build/market-compare.json --old app/build/old-core-check.json --build "$GITHUB_SHA" --out app/build/market-shots/market-health.json >> "$GITHUB_STEP_SUMMARY"
      - if: always() && steps.changed.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: market-shots
          path: |
            shift-calendar-app/app/build/market-shots/shots.json
            shift-calendar-app/app/build/market-shots/changed
            shift-calendar-app/app/build/market-shots/market-health.json
            shift-calendar-app/app/build/old-core-check.json
          retention-days: 30
  # 2.0.0 [RVA-55] (검토 I23b-01) 관리자 앱 화면 사진 회귀: 로컬 서버를 띄워 주요 12화면을 네 폭(380·840·1280·1440) × 밝음·어두움으로 찍어
  # ① 배치 문제(옆으로 넘침·빈 본문·화면 오류·본문 첫 줄이 화면 위 25% 아래)는 빨강, ② 지난 통합 빌드 사진과 크게 달라진 화면은 요약에(실패 아님,
  # 사진은 artifact admin-shots). 통합 브랜치 push 가운데 관리자 앱에 닿는 파일이 바뀐 것과 손으로 돌릴 때만(약 5분).
  admin-shots:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: shift-calendar-app/server/company-worker
    steps:
      - uses: actions/checkout@v4
      - id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null || true
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git diff --quiet "$BEFORE" HEAD -- src/admin src/admin-app.js src/admin-lib.js tools/admin-shots.mjs; then
            echo "run=0" >> "$GITHUB_OUTPUT"; echo "관리자 앱 화면 파일이 바뀌지 않았어요: 화면 사진을 건너뛰어요" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.changed.outputs.run == '1'
        run: npm ci && npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: The last integration build's admin shots
        if: steps.changed.outputs.run == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ../../../prev-admin-shots
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow android.yml --branch "$GITHUB_REF_NAME" --limit 30 --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n admin-shots -D ../../../prev-admin-shots >/dev/null 2>&1; then
              echo "지난 사진: 실행 $id" >> "$GITHUB_STEP_SUMMARY"; break
            fi
          done
      - name: Twelve screens, four widths, light and dark
        if: steps.changed.outputs.run == '1'
        run: |
          prev=$(find ../../../prev-admin-shots -name shots.json | head -1)
          node tools/admin-shots.mjs --start --out build/admin-shots --prev "${prev:--}" >> "$GITHUB_STEP_SUMMARY"
      - if: always() && steps.changed.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: admin-shots
          path: |
            shift-calendar-app/server/company-worker/build/admin-shots/shots.json
            shift-calendar-app/server/company-worker/build/admin-shots/changed
            shift-calendar-app/server/company-worker/build/admin-shots/png
          retention-days: 30
  lint:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    # 2.0.0 [RVR-45] With Gradle's cache cold, compiling the app takes about 14 minutes and lint's analysis about 15 more
    # (run 44433028533: stopped at 30 in :app:lintAnalyzeDebugUnitTest, then the watch app never ran). A lint that is cut
    # off reads as cancelled, not as what it found; 45 as the app's shards have.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: shift-calendar-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # 2.0.0 [RVR-46] 앱을 처음부터 컴파일하면 Gradle 기본 4g 힙이 모자라 'Java heap space'로 떨어졌어요(11-19 묶음 확인 실행, shots-e·unit). 홈의 gradle.properties가 저장소 것보다 앞서요.
      - run: mkdir -p "$HOME/.gradle" && echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' >> "$HOME/.gradle/gradle.properties"
      - run: sh ./gradlew $GRADLE_FLAGS :app:lintDebug --continue
      # [REL-09] The watch app builds and passes lint too. [RVR-12] (검토 TEST-13) and its unit tests run.
      - run: sh ./gradlew $GRADLE_FLAGS :wear:assembleDebug :wear:lintDebug :wear:testDebugUnitTest --continue
      - if: always()
        run: python3 tools/slow_tests.py wear/build/test-results >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            shift-calendar-app/app/build/reports
            shift-calendar-app/wear/build/reports
            shift-calendar-app/wear/build/test-results
          retention-days: 7
