name: Android (밤낮)
# [REPO-01] 1.34: the repository is private (결정 D110), where Actions has 2,000 minutes a month. A draft pull request runs
# the quick checks only (servers, core, tracker); the app's shards and lint run once it is ready for review, or by hand
# (Actions › Android › Run workflow). main is not built again after a merge: the same commits passed on the pull request.
# 2.0.0 [RVR-14] (총괄 HQ-37) 통합 PR은 초안이라 그 머리에서 앱 시험이 돌지 않았어요(서버 PR #463 뒤 InviteAppTest가 깨진 채
# 들어가 그 위 PR 넷이 함께 빨강). 통합 브랜치에 들어올 때마다 서버·core와 앱 (unit)이 돌아요(겹친 push는 앞 것을 멈춰요).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["shift-calendar-app/**", "privacy/**", "terms/**", "community/**", "remote/**", ".github/workflows/android.yml"]
  push:
    branches: [claude/project-thread-f33c16]
    paths: ["shift-calendar-app/**", "privacy/**", "terms/**", "community/**", "remote/**", ".github/workflows/android.yml"]
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
# [QA-05] The checks run as shards side by side instead of one job after another: the longest shard sets the
# wall clock. Gradle's cache is written only from main, so a pull request cannot fill it with its own builds.
env:
  GRADLE_FLAGS: --no-daemon -Pkotlin.compiler.execution.strategy=in-process --console=plain
jobs:
  servers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: shift-calendar-app/server/share-worker
      - run: npm test
        working-directory: shift-calendar-app/server/company-worker
      # [ADMUX-08] The admin app's happy-dom screen tests need the devDependency from the lock file.
      - run: npm ci && npm run test:ui
        working-directory: shift-calendar-app/server/company-worker
      # [RVR-03] 공개 사이트(bamnat.app): 임시 폴더에 만들어 공개 파일 목록·금지 글자·지난해 숫자를 보고, 웹 계산기를 앱과 같은 사례로 시험해요.
      - run: pip install --quiet openpyxl==3.1.5 && python3 tools/site/build.py --check
        working-directory: shift-calendar-app
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: shift-calendar-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # The pinned tool packages below (pillow 11.1.0, cryptography 44.0.2) ship wheels for this Python; the runner's own newer one
      # has none for pillow 11.1.0 and building it needs libjpeg (core job red on a8eb588e).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/check_tracker.py
      - run: python3 tools/test_check_checklist.py && python3 tools/test_app_size.py && python3 tools/test_market_works.py
      - run: python3 tools/test_dev_status.py
      # [RVR-12] (검토 TEST-13) 손으로 만드는 자료도 CI가 봐요: 근무주기 표가 CSV에서 그대로 나오는지, 공개 자료(remote/v1)가
      # 믿는 열쇠로 서명됐는지(.sig2), 핵심 화면 사진 이름이 시험에 그대로 있는지, 그리고 그 도구들의 시험.
      - run: python3 tools/test_cycles_build.py && python3 tools/cycles_build.py --check
      - run: pip install --quiet cryptography==44.0.2 && python3 tools/test_remote_sign.py && python3 tools/remote_sign.py check --need-sig2
      - run: pip install --quiet pillow==11.1.0 && python3 tools/test_shot_hashes.py && python3 tools/shot_hashes.py names
      - run: sh ./gradlew $GRADLE_FLAGS -p core test
      - if: always()
        run: python3 tools/slow_tests.py core/build/test-results >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-reports
          path: shift-calendar-app/core/build/reports
          retention-days: 7
  # The app's tests in four shards: everything but the screenshots, the screenshot classes in two halves, and the
  # classes that run on Android 8, 11, 13 and 15 (app/build.gradle.kts bamnat.testSet). Each shard runs its classes
  # in parallel forks too.
  app:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # [RVR-14] A push to the integration branch runs the unit shard only (the screenshots and Android levels run on its PR).
        set: ${{ fromJSON(github.event_name == 'push' && '["unit"]' || '["unit", "shots-a", "shots-b", "api"]') }}
    defaults:
      run:
        working-directory: shift-calendar-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # Robolectric's Android jars (100 MB and more) come from Maven Central once, then from this cache.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('shift-calendar-app/app/build.gradle.kts') }}
          restore-keys: robolectric-
      # [RVR-12] (검토 TEST-13) Node 22 before Gradle: the app tests that start server/company-worker (node:sqlite) need it, and
      # in CI (CI=true) a test that cannot find Node or the privacy page fails instead of being skipped (app test CiNeed.kt).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh ./gradlew $GRADLE_FLAGS :app:testDebugUnitTest -Pbamnat.testSet=${{ matrix.set }} --continue
      # Room writes the schema of each database version it builds. A new version has to be committed with its migration.
      - name: Room schema committed
        if: matrix.set == 'unit'
        run: |
          changed=$(git ls-files --others --modified --exclude-standard database/schemas)
          for f in $changed; do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done
          test -z "$changed" || { echo "Commit these schema files: $changed"; exit 1; }
      # The share server checks the payloads the app tests just wrote (app/build/share-payload*.json). [RVR-19] (검토 TEST-20 ④)
      # Here they must be there: the servers job skips them (no app run), so this is the one place they are checked.
      - if: matrix.set == 'unit'
        run: npm test
        working-directory: shift-calendar-app/server/share-worker
        env:
          BAMNAT_NEED_APP_PAYLOADS: "1"
      # 2.0.0 [RVR-22] (검토 SD-09) The company server's half of the 바깥 길 시험: the bodies OutsideBodiesTest just wrote.
      - if: matrix.set == 'unit'
        run: node --test --disable-warning=ExperimentalWarning test/outside-bodies.test.mjs
        working-directory: shift-calendar-app/server/company-worker
        env:
          BAMNAT_NEED_APP_PAYLOADS: "1"
      # [QA-06] 43 key screenshots (drawn on a fixed day, QA-08) against their fingerprints (tools/shot_hashes.py); a change that was meant
      # comes with `python3 tools/shot_hashes.py update app/build/screenshots` in the same pull request. [RVR-11] With --results, a key
      # shot whose test class ran in this shard but left no picture fails ('비교 못 함') instead of passing without a word.
      - if: startsWith(matrix.set, 'shots-')
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Key screenshots unchanged
        if: startsWith(matrix.set, 'shots-')
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/shot_hashes.py check app/build/screenshots --results app/build/test-results/testDebugUnitTest >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: python3 tools/slow_tests.py app/build/test-results/testDebugUnitTest --json app/build/tests-${{ matrix.set }}.json >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-reports-${{ matrix.set }}
          path: |
            shift-calendar-app/app/build/test-results/testDebugUnitTest
            shift-calendar-app/app/build/reports
            shift-calendar-app/app/build/screenshots
            shift-calendar-app/app/build/tests-${{ matrix.set }}.json
          retention-days: 7
  # 2.0.0 [RVR-14] (총괄 HQ-37) A draft pull request that changes a server runs the app tests that start that server
  # (server/company-worker/test/local-server.mjs, or the share server's payload check), so a server answer the app no longer
  # reads fails on the pull request that changed it, not on the integration branch after it.
  server-app:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shift-calendar-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if git diff --quiet ${{ github.event.pull_request.base.sha }} HEAD -- server/; then
            echo "server=0" >> "$GITHUB_OUTPUT"; echo "서버가 바뀌지 않았어요: 앱의 서버 시험은 준비 PR 때 돌아요" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "server=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.server == '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: steps.changed.outputs.server == '1'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - if: steps.changed.outputs.server == '1'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('shift-calendar-app/app/build.gradle.kts') }}
          restore-keys: robolectric-
      - if: steps.changed.outputs.server == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # The classes that start server/company-worker/test/local-server.mjs, and ShareLinkTest (it writes the payloads the share
      # server checks next). tools/server_app_tests.py finds them in the test sources, so a new one joins by itself.
      - if: steps.changed.outputs.server == '1'
        run: sh ./gradlew $GRADLE_FLAGS :app:testDebugUnitTest $(python3 tools/server_app_tests.py --gradle) --continue
      - if: steps.changed.outputs.server == '1'
        run: npm test
        working-directory: shift-calendar-app/server/share-worker
        env:
          BAMNAT_NEED_APP_PAYLOADS: "1"
      - if: steps.changed.outputs.server == '1'
        run: node --test --disable-warning=ExperimentalWarning test/outside-bodies.test.mjs
        working-directory: shift-calendar-app/server/company-worker
        env:
          BAMNAT_NEED_APP_PAYLOADS: "1"
      - if: always() && steps.changed.outputs.server == '1'
        run: python3 tools/slow_tests.py app/build/test-results/testDebugUnitTest >> "$GITHUB_STEP_SUMMARY"
      - if: always() && steps.changed.outputs.server == '1'
        uses: actions/upload-artifact@v4
        with:
          name: server-app-reports
          path: |
            shift-calendar-app/app/build/test-results/testDebugUnitTest
            shift-calendar-app/app/build/reports
          retention-days: 7
  # 2.0.0 [RVR-21] (검토 SD-07, 스튜디오 제작 오류 점검 S6-3·S6-4) 장터 작품 전체(docs/recipes, tools/market_works.py):
  # ① 나간 판(tools/data/release-cores.json, 1.36.1~1.39)의 core를 따로 빌드해 그 판 목록에 나오는 작품이 다 열리는지(안 열리면 빨강),
  # ② 작품마다 실제로 넣은 달력을 찍어 지난 통합 빌드의 지문과 대고 크게 달라진 것만 요약에(실패 아님, 사진은 artifact market-shots),
  # ③ [RVR-22] (SD-09) 작품마다 넣은 폰의 링크·자동 갱신·회사 방식 공유·다시 올리기 몸통을 두 서버의 검사기가 모두 받는지(안 받으면 빨강).
  # 통합 브랜치 push 가운데 작품·그리기에 닿는 파일이 바뀐 것과 손으로 돌릴 때만(약 20분).
  market:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: shift-calendar-app
    steps:
      - uses: actions/checkout@v4
      - id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null || true
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git diff --quiet "$BEFORE" HEAD -- docs/recipes \
              core/src/main/kotlin/com/bamnat/core/recipe app/src/main/java/com/bamnat/app/recipe app/src/main/java/com/bamnat/app/ui/theme \
              app/src/main/java/com/bamnat/app/ui/calendar app/src/main/java/com/bamnat/app/ui/parts app/src/main/java/com/bamnat/app/ui/decor \
              server/company-worker/src/recipes.js server/company-worker/src/parts-since.js server/company-worker/tools/served-works.mjs \
              tools/market_works.py tools/old_core_check.py tools/market_shots.py tools/data/release-cores.json \
              server/share-worker/src server/company-worker/src/company-setup.js app/src/main/java/com/bamnat/app/share \
              app/src/test/java/com/bamnat/app/screenshots/MarketWorks.kt app/src/test/java/com/bamnat/app/screenshots/MarketWorksShotsTest.kt \
              app/src/test/java/com/bamnat/app/recipe/OutsideBodiesTest.kt; then
            echo "run=0" >> "$GITHUB_OUTPUT"; echo "작품·그리기에 닿는 파일이 바뀌지 않았어요: 장터 작품 대조를 건너뛰어요" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: steps.changed.outputs.run == '1'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - if: steps.changed.outputs.run == '1'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('shift-calendar-app/app/build.gradle.kts') }}
          restore-keys: robolectric-
      - if: steps.changed.outputs.run == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.changed.outputs.run == '1'
        run: python3 tools/test_market_works.py
      - name: Old apps open every work they list
        if: steps.changed.outputs.run == '1'
        run: python3 tools/old_core_check.py --json app/build/old-core-check.json >> "$GITHUB_STEP_SUMMARY"
      - name: Every work on the calendar, and every work's bodies going out (SD-09)
        if: always() && steps.changed.outputs.run == '1'
        run: |
          sh ./gradlew $GRADLE_FLAGS :app:testDebugUnitTest --tests com.bamnat.app.screenshots.MarketWorksShotsTest \
            --tests com.bamnat.app.recipe.OutsideBodiesTest -Pbamnat.marketShots=all -Pbamnat.outsideBodies=all --rerun --continue
      - name: The three servers take every work's bodies (SD-09)
        if: always() && steps.changed.outputs.run == '1'
        env:
          BAMNAT_NEED_APP_PAYLOADS: "1"
        run: |
          (cd server/share-worker && node --test --disable-warning=ExperimentalWarning test/outside-bodies.test.mjs)
          (cd server/company-worker && node --test --disable-warning=ExperimentalWarning test/outside-bodies.test.mjs)
      - name: The last integration build's fingerprints
        if: always() && steps.changed.outputs.run == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ../prev-shots
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow android.yml --branch "$GITHUB_REF_NAME" --limit 30 --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n market-shots -D ../prev-shots >/dev/null 2>&1; then
              echo "지난 지문: 실행 $id" >> "$GITHUB_STEP_SUMMARY"; break
            fi
          done
      - name: Works that look different from the last build
        if: always() && steps.changed.outputs.run == '1'
        run: |
          prev=$(find ../prev-shots -name shots.json | head -1)
          python3 tools/market_shots.py compare "${prev:--}" app/build/market-shots/shots.json \
            --png app/build/market-shots/png --changed-out app/build/market-shots/changed >> "$GITHUB_STEP_SUMMARY"
      - if: always() && steps.changed.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: market-shots
          path: |
            shift-calendar-app/app/build/market-shots/shots.json
            shift-calendar-app/app/build/market-shots/changed
            shift-calendar-app/app/build/old-core-check.json
          retention-days: 30
  lint:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shift-calendar-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: sh ./gradlew $GRADLE_FLAGS :app:lintDebug --continue
      # [REL-09] The watch app builds and passes lint too. [RVR-12] (검토 TEST-13) and its unit tests run.
      - run: sh ./gradlew $GRADLE_FLAGS :wear:assembleDebug :wear:lintDebug :wear:testDebugUnitTest --continue
      - if: always()
        run: python3 tools/slow_tests.py wear/build/test-results >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            shift-calendar-app/app/build/reports
            shift-calendar-app/wear/build/reports
            shift-calendar-app/wear/build/test-results
          retention-days: 7
