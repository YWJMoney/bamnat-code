# 1.39 [DEPLOY-01] 서버 자동 배포 (크롬·대시보드 붙여 넣기 없이). 사용자 결정 2026-11-08: Claude가 시작해 끝까지(승인 단계 없음).
# 시작: Actions › deploy-server › Run workflow (main에서), 배포할 브랜치를 ref에. Claude는 GitHub 도구로 같은 일을 해요.
# 안전장치는 shift-calendar-app/tools/deploy_worker.py 맨 위 설명: 시험 → 올리기만 → 바인딩 대조 → (회사) 카나리 → 100% → health 5번
# → 실패면 앞 판·정기 작업까지 되돌리고 되돌린 것을 다시 확인.
#
# 2.0.0 [RVQ-01] 검토 SRV-02: 일을 넷으로 나눠 Cloudflare 토큰과 고른 브랜치의 코드가 한 기계에 있지 않게 해요.
#   gate  (main에서 누른 것만) ref가 main·열린 PR의 브랜치인지 보고, 지금 판을 올린 커밋을 읽어요. main의 도구만 돌아요.
#   build (토큰 없음)  고른 브랜치의 npm ci --ignore-scripts·npm test·번들·스키마 호환. 결과 파일만 넘겨요.
#   ship  (토큰 있음)  main의 도구 + build가 만든 번들·설정만. 설정은 아는 칸만 받아요(명령을 돌리는 칸이 있으면 멈춤).
# 바깥 액션은 커밋 번호로, wrangler는 tools/deploy/package-lock.json(무결성 값)으로 묶어요.
# 열쇠: 저장소 Settings › Secrets › Actions의 CLOUDFLARE_API_TOKEN(Cloudflare 'Workers 편집' 토큰, 밤낮 계정만). gate의 지금 판 읽기와 ship의
# 배포 단계 env에만 있어요(job 전체 env가 아니에요). 사용자가 한 번 볼 것: 토큰 권한이 '밤낮 Worker 두 개 편집'으로 좁혀져 있는지.
# 고를 수 있는 값: Variables의 CLOUDFLARE_ACCOUNT_ID(토큰이 닿는 계정이 하나면 없어도 됨), BAMNAT_API·BAMNAT_SHARE(health 주소, 기본 api.·s.bamnat.app).
name: deploy-server
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 배포할 브랜치·커밋 (main, 열린 PR의 브랜치, 그 안의 커밋만. 예 claude/project-thread-f33c16)
        required: true
        default: main
      target:
        description: 어느 서버
        type: choice
        options: [both, company, share]
        default: both
      mode:
        description: check는 올리고 대조까지만(손님은 앞 판), deploy는 끝까지
        type: choice
        options: [check, deploy]
        default: check
      reason:
        description: 왜 배포하는지 한 줄 (배포 기록에 남아요)
        required: false
        default: ""
      allow_older:
        description: 지금 도는 판보다 낮은 판도 올리기(되돌릴 때만)
        type: boolean
        default: false
      skip_tests:
        description: "[RVR-17] 날짜에 묶여 낡은 시험 넘기기 '시험 이름|까닭|기한 YYYY-MM-DD' (여러 개는 ;로, 기한 14일 안, 배포 기록에 남아요)"
        required: false
        default: ""
  pull_request:
    paths: ["shift-calendar-app/tools/deploy_worker.py", "shift-calendar-app/tools/test_deploy_worker.py", "shift-calendar-app/tools/test_deploy_flow.py", "shift-calendar-app/tools/date_watch.py", "shift-calendar-app/tools/test_date_watch.py", "shift-calendar-app/tools/deploy/**", ".github/workflows/deploy-server.yml"]
permissions:
  contents: read
# 배포는 한 번에 하나씩, 도중에 끊지 않아요.
concurrency:
  group: deploy-server
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 shift-calendar-app/tools/test_deploy_worker.py
      - run: python3 shift-calendar-app/tools/test_deploy_flow.py
      - run: python3 shift-calendar-app/tools/test_date_watch.py

  gate:
    # 다른 브랜치에서 누르면 그 브랜치의 workflow·도구가 쓰여 안전장치를 비켜 갈 수 있어서, main에서 누른 것만 받아요.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      company_prev: ${{ steps.probe.outputs.company_prev }}
    env:
      IN_REF: ${{ inputs.ref }}
      IN_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: 배포 도구 시험
        run: |
          python3 shift-calendar-app/tools/test_deploy_worker.py
          python3 shift-calendar-app/tools/test_deploy_flow.py
      - name: ref 확인
        id: ref
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 shift-calendar-app/tools/deploy_worker.py --check-ref "$IN_REF"
      - name: wrangler(묶은 판)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix shift-calendar-app/tools/deploy
      - name: 지금 판을 올린 커밋
        id: probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 shift-calendar-app/tools/deploy_worker.py --phase probe --worker "$IN_TARGET"

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      IN_TARGET: ${{ inputs.target }}
      IN_SKIP: ${{ inputs.skip_tests }}
    steps:
      # 도구는 main의 것, 서버 코드는 고른 커밋의 것, 앞 판 코드는 지금 도는 판의 커밋(스키마 호환).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.sha }}
          path: target
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: needs.gate.outputs.company_prev != ''
        with:
          ref: ${{ needs.gate.outputs.company_prev }}
          path: prev
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: 시험·번들·스키마 호환 (토큰 없음)
        run: |
          skip=(); [ -n "$IN_SKIP" ] && skip=(--skip-test "$IN_SKIP")
          BAMNAT_SERVER_ROOT="$GITHUB_WORKSPACE/target/shift-calendar-app/server" \
            python3 shift-calendar-app/tools/deploy_worker.py --phase build --worker "$IN_TARGET" \
              --out "$RUNNER_TEMP/ship" --prev "$GITHUB_WORKSPACE/prev/shift-calendar-app/server" "${skip[@]}"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ship
          path: ${{ runner.temp }}/ship
          retention-days: 3
          if-no-files-found: error
      # [U60-02] 시험에서 멈추면 실패한 시험 이름·줄(<서버>-fail.json)만 따로 넘겨 explain이 어제 main과 견줘요.
      - if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: build-fail
          path: ${{ runner.temp }}/ship/fail
          retention-days: 7
          if-no-files-found: ignore

  # 2.0.0 [U60-02] (검토 2026-11-12) 배포가 시험에서 멈췄을 때 요약 맨 위에: 실패한 시험 이름·줄, 어제 main(날짜 시험 +0일)에서는
  # 통과/실패, 그래서 할 일(main에서도 깨지면 이 브랜치 탓이 아니니 고치는 PR 먼저, 급하면 skip_tests). 토큰 없음, main의 도구만.
  explain:
    needs: [gate, build]
    if: failure() && needs.build.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        continue-on-error: true
        with:
          name: build-fail
          path: ${{ runner.temp }}/fail
      - name: 어제 main과 견주기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main="$RUNNER_TEMP/main"
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow date-watch.yml --branch main --status completed --limit 6 --json databaseId --jq '.[].databaseId'); do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n date-watch-servers-0 -D "$main" 2>/dev/null && break
          done
          echo "### 시험에서 멈춤: 어제 main과 견주기" >> "$GITHUB_STEP_SUMMARY"
          shopt -s nullglob
          got=0
          for f in "$RUNNER_TEMP"/fail/*-fail.json; do
            w=$(basename "$f" -fail.json)
            python3 shift-calendar-app/tools/date_watch.py explain "$f" "$main/$w+0.json" >> "$GITHUB_STEP_SUMMARY"
            got=1
          done
          [ "$got" = 1 ] || echo "시험 말고 다른 단계(번들·스키마 호환)에서 멈췄어요. 위 build 요약을 봐요" >> "$GITHUB_STEP_SUMMARY"

  ship:
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      # 고른 브랜치는 받지 않아요: main의 도구 + build가 만든 파일만.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: wrangler(묶은 판)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix shift-calendar-app/tools/deploy
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ship
          path: ${{ runner.temp }}/ship
      - name: 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BAMNAT_API: ${{ vars.BAMNAT_API }}
          BAMNAT_SHARE: ${{ vars.BAMNAT_SHARE }}
          SHIP_SHA: ${{ needs.gate.outputs.sha }}
          IN_REF: ${{ inputs.ref }}
          IN_TARGET: ${{ inputs.target }}
          IN_MODE: ${{ inputs.mode }}
          IN_REASON: ${{ inputs.reason }}
          IN_OLDER: ${{ inputs.allow_older }}
        run: |
          echo "## 서버 배포 ${IN_MODE}: ${IN_REF} (${SHIP_SHA:0:8})" >> "$GITHUB_STEP_SUMMARY"
          older=(); [ "$IN_OLDER" = "true" ] && older=(--allow-older)
          python3 shift-calendar-app/tools/deploy_worker.py --phase ship --worker "$IN_TARGET" --from "$RUNNER_TEMP/ship" \
            --mode "$IN_MODE" --sha "$SHIP_SHA" --reason "$IN_REASON" "${older[@]}"
