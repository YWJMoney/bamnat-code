# The core build is also run on its own (`./gradlew -p core test` in CI). Gradle then reads this file, not the
# root gradle.properties, so without it the build JVM gets the 512 MB default and its garbage collector thrashes
# while compiling 1.30 core in-process.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
