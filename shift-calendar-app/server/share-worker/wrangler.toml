# [MKT-09] Read-only schedule links. Deploy: `npx wrangler deploy` with CLOUDFLARE_API_TOKEN set.
name = "bamnat-share"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
# 1.39 운영 설정 지키기: 대시보드에서 넣은 일반 변수(VAPID_SUBJECT, SHARE_BASE_URL 등)는 저장소에 적지 않아요(운영 값).
# `npx wrangler deploy`가 그 변수를 지우지 않게 둬요. Secret은 원래 배포로 지워지지 않아요.
keep_vars = true

# 1.39 관리자 앱 머리띠의 '지금 도는 서버 판'(사용자 11-08): 배포 번호·커밋(배포 도구의 --tag)·배포 시각. 회사 서버만 관리 열쇠로 읽어요.
[version_metadata]
binding = "CF_VERSION_METADATA"

[[kv_namespaces]]
binding = "SHARES"
# Filled in after `npx wrangler kv namespace create SHARES`.
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# 2.0.0 [RVD-33][RVQ-57] 앱 없는 팀원 방(Q1 4h)의 Durable Object. 이름·태그는 갈래 D의 바닥 판(RVD-33)과 글자 그대로 같아요.
# 클래스를 새로 만드는 migration은 versions upload가 못 올려 바닥 판을 배포 도구 mode migrate(wrangler deploy)로 먼저 올리고,
# 그 뒤 2.0.0 묶음은 평소처럼 check → deploy예요(이미 적용된 migration이라 그대로 올라가요). 토큰은 지금 'Workers Scripts 편집'이면 돼요.
# 바인딩을 지우는 migration(deleted_classes)은 방 데이터를 지워요: 하지 않아요.
[[durable_objects.bindings]]
name = "TEAM_ROUND"
class_name = "TeamRound"

[[migrations]]
tag = "v1-team-round"
new_sqlite_classes = ["TeamRound"]
