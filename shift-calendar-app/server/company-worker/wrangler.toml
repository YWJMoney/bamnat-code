# [COMM-04] Company rules shared by coworkers, and the developer app at /admin [ADMIN-01].
# Dashboard deploy: see README.md. CLI deploy: `npx wrangler deploy` with CLOUDFLARE_API_TOKEN set.
name = "bamnat-company"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
# 1.39 운영 설정 지키기: 대시보드에서 넣은 일반 변수(VAPID_SUBJECT, SHARE_BASE_URL 등)는 저장소에 적지 않아요(운영 값).
# `npx wrangler deploy`가 그 변수를 지우지 않게 둬요. Secret은 원래 배포로 지워지지 않아요.
keep_vars = true

# SP1 1.30 [SPD-02] Smart Placement: the Worker runs near the D1 database when that answers faster, so one answer does not cross
# the sea for each of its reads. A dashboard deploy sets it in Settings > General > Placement (README 5-3).
# 1.39 [ADM3-52] 사용자 카드 2026-11-09 '한국 가까이에서 돌기': Smart Placement가 서버를 미국 시카고(remote-ORD)에 두어 APAC D1을
# 한 번 오갈 때마다 0.2초쯤 걸렸어요(결정함 3초). 서울 리전으로 고정해 사용자(한국)와 D1(APAC) 가까이에서 돌아요.
[placement]
region = "aws:ap-northeast-2"

# Clears network hashes, spent limits and old questions on time even when nobody sends anything.
[triggers]
# 1.38 [DESK-09] */5: 보류가 끝난 Claude 답 보내기만.
crons = ["17 * * * *", "*/5 * * * *"]

# 1.39 실서버(11-08): 배포마다 바뀌는 번호. 판 이름(1.39.0)이 같아도 다시 배포하면 사고 › 바꾼 것에 '서버 배포' 한 줄이 남아요.
# 대시보드 배포라면 Settings > Bindings > 바인딩 추가 > 버전 메타데이터(Version metadata), 변수 이름 CF_VERSION_METADATA.
[version_metadata]
binding = "CF_VERSION_METADATA"

[[d1_databases]]
binding = "DB"
database_name = "bamnat-company"
# Filled in after `npx wrangler d1 create bamnat-company`.
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# 1.38 [ADM3-16] 하루 백업(R2, 14일). 버킷을 만든 뒤(`npx wrangler r2 bucket create bamnat-backup`) 아래 세 줄의 # 를 지워요.
# 대시보드 배포라면 Settings > Bindings > R2 bucket, 이름 BACKUP. 묶지 않아도 서버는 돌고, 서버 상태에 '백업 꺼짐'으로 보여요.
# [[r2_buckets]]
# binding = "BACKUP"
# bucket_name = "bamnat-backup"
